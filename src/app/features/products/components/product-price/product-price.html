<div class="flex flex-wrap items-center gap-2">
    <span class="text-lg font-bold text-gray-900">{{ price() | currencyFormat }}</span>
    @if (oldPrice(); as old) {
    <span class="text-sm text-gray-400 line-through">{{ old | currencyFormat }}</span>
    }
    @if (discountPercent(); as percent) {
    <span class="rounded-full bg-primary-50 px-2 py-0.5 text-xs font-semibold text-primary-600">
        -{{ percent }}%
    </span>
    }
</div>
